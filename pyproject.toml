[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marker-6dof-tracking"
version = "0.1.0"
description = "D455 multi-face ArUco relative 6DoF tracking algorithms with JSON output"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Dex"}]
dependencies = [
  "numpy>=1.23,<3",
  "opencv-contrib-python-headless>=4.8,<5",
  "scipy>=1.9,<2",
]

[project.optional-dependencies]
d455 = ["pyrealsense2>=2.50,<3"]

[project.scripts]
marker-run-video = "marker6dof.cli:run_video"
marker-build-relative = "marker6dof.cli:build_relative"
marker-track-d455 = "marker6dof.cli:track_d455"

[tool.setuptools.packages.find]
where = ["src"]
