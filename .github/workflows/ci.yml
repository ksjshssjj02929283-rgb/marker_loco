name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - run: python scripts/generate_demo.py --output-dir /tmp/marker-demo
      - run: python scripts/run_video.py --config configs/demo_calibration.json --video /tmp/marker-demo/demo_input.avi --output-dir /tmp/marker-demo/result --no-annotated-video
      - run: python scripts/evaluate_demo.py --ground-truth /tmp/marker-demo/ground_truth.csv --estimates /tmp/marker-demo/result/tcp_poses.csv --output /tmp/marker-demo/result/evaluation.json
