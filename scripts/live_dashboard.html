<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D455 实时轨迹</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #091019;
      --panel: rgba(18, 27, 38, .92);
      --line: #29384a;
      --text: #eef4fa;
      --muted: #91a2b5;
      --multi: #54d28b;
      --single: #f2bc61;
      --warn: #ff8b57;
      --lost: #ff6472;
      font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -20%, #17304a 0, transparent 38rem),
        linear-gradient(145deg, #091019, #0d141d 55%, #080d13);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 64px;
      padding: 10px 22px;
      background: rgba(9, 16, 25, .86);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .title { display: flex; align-items: center; gap: 12px; }
    .title h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
    .title small { color: var(--muted); }
    .toolbar { display: flex; align-items: center; gap: 10px; }
    button {
      border: 1px solid #3a4b60;
      border-radius: 8px;
      padding: 8px 11px;
      color: #dfeaf3;
      background: #172333;
      cursor: pointer;
    }
    button:hover { border-color: #68809c; }
    .pill {
      min-width: 96px;
      padding: 7px 12px;
      border: 1px solid currentColor;
      border-radius: 999px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    main { max-width: 1680px; margin: auto; padding: 16px; }
    .top { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(310px, .85fr); gap: 14px; }
    .surface {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 14px 40px rgba(0, 0, 0, .22);
    }
    .camera-wrap { position: relative; min-height: 280px; background: #05090e; }
    #camera { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
    .camera-caption {
      position: absolute;
      right: 12px;
      bottom: 10px;
      padding: 6px 9px;
      border-radius: 7px;
      color: #c9d5df;
      background: rgba(4, 9, 14, .74);
      font: 12px ui-monospace, monospace;
    }
    .panel { padding: 17px; }
    .reason { min-height: 42px; margin: 0 0 16px; color: #c7d1dc; font-size: 14px; line-height: 1.5; }
    .label { margin: 0 0 5px; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .position { margin: 0 0 18px; font: 600 22px/1.3 ui-monospace, monospace; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 18px; }
    .metric .value { font: 600 17px ui-monospace, monospace; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .tag {
      min-width: 50px;
      padding: 6px 8px;
      color: #74879a;
      border: 1px solid #304054;
      border-radius: 7px;
      background: #121c28;
      font-size: 12px;
      text-align: center;
    }
    .tag.visible { color: #dce7f1; border-color: #61758d; }
    .tag.used { color: #07160e; border-color: var(--multi); background: var(--multi); font-weight: 700; }
    .scale-stats { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .scale-row {
      display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
      padding: 5px 0; border-bottom: 1px solid #1d2a3a;
    }
    .scale-row span { color: var(--muted); font-size: 12px; }
    .scale-row b { font: 600 14px ui-monospace, monospace; color: #e6eef6; white-space: nowrap; }
    .space-panel { margin-top: 14px; }
    .space-head { display: flex; align-items: center; gap: 10px; }
    .space-head button { padding: 5px 9px; font-size: 11px; }
    .plots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
    .plot-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 0; }
    .plot-head strong { font-size: 13px; }
    .plot-head span { color: var(--muted); font-size: 11px; }
    canvas { display: block; width: 100%; height: 300px; }
    #space { height: 440px; cursor: grab; touch-action: none; }
    #space.dragging { cursor: grabbing; }
    .axis-key { display: inline-flex; align-items: center; gap: 5px; margin-left: 10px; }
    .axis-key i { display: inline-block; width: 13px; height: 3px; border-radius: 2px; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 13px; color: var(--muted); font-size: 12px; }
    .legend span::before { content: ""; display: inline-block; width: 18px; height: 3px; margin: 0 6px 3px 0; border-radius: 2px; background: var(--multi); }
    .legend .single::before { background: var(--single); }
    .legend .raw::before { height: 1px; background: #71869c; }
    @media (max-width: 1050px) { .top, .plots { grid-template-columns: 1fr; } canvas { height: 270px; } #space { height: 380px; } }
    @media (max-width: 620px) { header { align-items: flex-start; padding: 10px 12px; } .title small { display: none; } main { padding: 10px; } .toolbar button:first-child { display: none; } .position { font-size: 17px; } }
  </style>
</head>
<body>
  <header>
    <div class="title"><h1>D455 / 多面 ArUco 实时轨迹</h1><small>联合定位 · 分段显示 · 自适应平滑</small></div>
    <div class="toolbar">
      <button id="rawToggle" type="button">隐藏原始轨迹</button>
      <button id="reset" type="button">重置原点</button>
      <div class="pill" id="status">STARTING</div>
    </div>
  </header>
  <main>
    <div class="top">
      <div class="surface camera-wrap">
        <img id="camera" alt="D455 实时画面">
        <div class="camera-caption" id="cameraMeta">等待视频流</div>
      </div>
      <aside class="surface panel">
        <p class="reason" id="reason">正在启动相机</p>
        <p class="label">平滑相对位置 / mm</p>
        <p class="position" id="position">—</p>
        <p class="label">平滑相对姿态 RPY / deg</p>
        <p class="position" id="orientation">—</p>
        <div class="metric-grid">
          <div class="metric"><p class="label">重投影误差</p><div class="value" id="error">—</div></div>
          <div class="metric"><p class="label">实时帧率</p><div class="value" id="rate">—</div></div>
          <div class="metric"><p class="label">轨迹点</p><div class="value" id="points">0</div></div>
          <div class="metric"><p class="label">当前分段</p><div class="value" id="segment">0</div></div>
        </div>
        <p class="label" style="margin-top:19px">标定 Tag（绿色为本帧采用）</p>
        <div class="tags" id="tags"></div>
        <p class="label" style="margin-top:19px">尺度统计（相对原点）</p>
        <div class="scale-stats">
          <div class="scale-row"><span>位移模长 |Δ|</span><b id="dispMag">—</b></div>
          <div class="scale-row"><span>峰值位移</span><b id="peakMag">—</b></div>
          <div class="scale-row"><span>X 极差</span><b id="rangeX">—</b></div>
          <div class="scale-row"><span>Y 极差</span><b id="rangeY">—</b></div>
          <div class="scale-row"><span>Z 极差</span><b id="rangeZ">—</b></div>
          <div class="scale-row"><span>总行程</span><b id="pathLen">—</b></div>
        </div>
      </aside>
    </div>
    <section class="surface space-panel">
      <div class="plot-head">
        <div><strong>3D 6DoF 空间轨迹</strong><span class="axis-key"><i style="background:#ff5f68"></i>X</span><span class="axis-key"><i style="background:#55d98b"></i>Y</span><span class="axis-key"><i style="background:#5ca8ff"></i>Z</span></div>
        <div class="space-head"><span id="spaceScale">拖动旋转 · 滚轮缩放</span><button id="viewReset" type="button">重置视角</button></div>
      </div>
      <canvas id="space"></canvas>
    </section>
    <section class="plots">
      <div class="surface"><div class="plot-head"><strong>XY / 正视</strong><span id="xyScale">—</span></div><canvas id="xy"></canvas></div>
      <div class="surface"><div class="plot-head"><strong>XZ / 俯视</strong><span id="xzScale">—</span></div><canvas id="xz"></canvas></div>
      <div class="surface"><div class="plot-head"><strong>YZ / 侧视</strong><span id="yzScale">—</span></div><canvas id="yz"></canvas></div>
    </section>
    <div class="legend"><span>多面联合定位</span><span class="single">单面定位</span><span class="raw">原始观测（细线）</span></div>
  </main>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const defaultTagIds = [2, 3, 4, 5];
    const views = {};
    let showRaw = true;
    let lastState = null;
    let spaceFit = null;
    const spaceCamera = { yaw: -.72, pitch: .46, zoom: 1, dragging: false, x: 0, y: 0 };

    const colors = { MULTI: '#54d28b', SINGLE: '#f2bc61', WARN: '#ff8b57', LOST: '#ff6472', ERROR: '#ff6472', STARTING: '#91a2b5' };
    const format = (value, digits = 1) => value == null ? '—' : Number(value).toFixed(digits);
    const niceStep = raw => {
      const power = 10 ** Math.floor(Math.log10(Math.max(raw, 1e-6)));
      const value = raw / power;
      return (value <= 1 ? 1 : value <= 2 ? 2 : value <= 5 ? 5 : 10) * power;
    };
    const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
    const fmtMm = metres => metres == null ? '—' : `${(metres * 1000).toFixed(1)} mm`;
    const fmtCmMm = metres => metres == null ? '—' : `${(metres * 100).toFixed(1)} cm · ${(metres * 1000).toFixed(1)} mm`;

    function scaleStats(trace) {
      const min = [0, 0, 0], max = [0, 0, 0];
      let peak = 0, path = 0, previous = null;
      for (const point of trace) {
        const p = point.smooth;
        peak = Math.max(peak, Math.hypot(p[0], p[1], p[2]));
        for (let axis = 0; axis < 3; axis++) { min[axis] = Math.min(min[axis], p[axis]); max[axis] = Math.max(max[axis], p[axis]); }
        if (previous) path += Math.hypot(p[0] - previous[0], p[1] - previous[1], p[2] - previous[2]);
        previous = p;
      }
      const current = trace.length ? trace[trace.length - 1].smooth : null;
      return {
        mag: current ? Math.hypot(current[0], current[1], current[2]) : null,
        peak,
        range: [0, 1, 2].map(axis => max[axis] - min[axis]),
        path,
      };
    }

    function quaternionToEuler(quaternion) {
      if (!quaternion) return null;
      const [x, y, z, w] = quaternion;
      const roll = Math.atan2(2 * (w * x + y * z), 1 - 2 * (x * x + y * y));
      const pitchTerm = clamp(2 * (w * y - z * x), -1, 1);
      const pitch = Math.asin(pitchTerm);
      const yaw = Math.atan2(2 * (w * z + x * y), 1 - 2 * (y * y + z * z));
      return [roll, pitch, yaw].map(value => value * 180 / Math.PI);
    }

    function rotateVector(quaternion, vector) {
      const [qx, qy, qz, qw] = quaternion || [0, 0, 0, 1];
      const [vx, vy, vz] = vector;
      const tx = 2 * (qy * vz - qz * vy);
      const ty = 2 * (qz * vx - qx * vz);
      const tz = 2 * (qx * vy - qy * vx);
      return [
        vx + qw * tx + qy * tz - qz * ty,
        vy + qw * ty + qz * tx - qx * tz,
        vz + qw * tz + qx * ty - qy * tx,
      ];
    }

    function updateSpaceFit(trace) {
      const points = trace.map(point => point.smooth);
      points.push([0, 0, 0]);
      const mins = [0, 1, 2].map(axis => Math.min(...points.map(point => point[axis])));
      const maxs = [0, 1, 2].map(axis => Math.max(...points.map(point => point[axis])));
      const center = mins.map((value, axis) => (value + maxs[axis]) / 2);
      const span = Math.max(...mins.map((value, axis) => maxs[axis] - value), .06);
      if (!spaceFit) spaceFit = { center: [...center], span };
      const expanding = span > spaceFit.span * 1.02;
      const alpha = expanding ? .32 : .025;
      spaceFit.center = spaceFit.center.map((value, axis) => value + (center[axis] - value) * alpha);
      spaceFit.span += (span - spaceFit.span) * (expanding ? .4 : .012);
      spaceFit.span = Math.max(spaceFit.span, span * .985, .06);
      return spaceFit;
    }

    function drawSpace(trace) {
      const canvas = $('space');
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const width = rect.width, height = rect.height;
      ctx.fillStyle = '#0d1722'; ctx.fillRect(0, 0, width, height);
      const fit = updateSpaceFit(trace);
      const scale = Math.min(width, height) / (fit.span * 1.55) * spaceCamera.zoom;
      const project = point => {
        const dx = point[0] - fit.center[0], dy = point[1] - fit.center[1], dz = point[2] - fit.center[2];
        const cy = Math.cos(spaceCamera.yaw), sy = Math.sin(spaceCamera.yaw);
        const cp = Math.cos(spaceCamera.pitch), sp = Math.sin(spaceCamera.pitch);
        const rx = cy * dx - sy * dz;
        const rz = sy * dx + cy * dz;
        const ry = cp * dy - sp * rz;
        return [width * .5 + rx * scale, height * .53 + ry * scale, sp * dy + cp * rz];
      };
      const line = (from, to, color, lineWidth = 1, dash = []) => {
        const a = project(from), b = project(to);
        ctx.strokeStyle = color; ctx.lineWidth = lineWidth; ctx.setLineDash(dash);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        ctx.setLineDash([]);
        return b;
      };

      const step = niceStep(fit.span / 5);
      const gridRadius = Math.ceil((fit.span * .85 + Math.max(Math.abs(fit.center[0]), Math.abs(fit.center[2]))) / step) * step;
      for (let value = -gridRadius; value <= gridRadius + step / 2; value += step) {
        line([-gridRadius, 0, value], [gridRadius, 0, value], 'rgba(65,86,108,.34)');
        line([value, 0, -gridRadius], [value, 0, gridRadius], 'rgba(65,86,108,.34)');
      }
      ctx.font = '10px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(150,168,190,.72)';
      for (let value = -gridRadius; value <= gridRadius + step / 2; value += step) {
        if (Math.abs(value) < step * .5) continue;
        const label = String(Math.round(value * 1000));
        const xTick = project([value, 0, 0]);
        ctx.fillText(label, xTick[0] + 3, xTick[1] - 3);
        const zTick = project([0, 0, value]);
        ctx.fillText(label, zTick[0] + 3, zTick[1] - 3);
      }
      const worldAxis = fit.span * .38;
      const axisColors = ['#ff5f68', '#55d98b', '#5ca8ff'];
      const basis = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
      basis.forEach((axis, index) => {
        const end = axis.map(value => value * worldAxis);
        const screen = line([0, 0, 0], end, `${axisColors[index]}99`, 1.5);
        ctx.fillStyle = axisColors[index]; ctx.font = '11px ui-monospace, monospace';
        ctx.fillText(['+X', '+Y', '+Z'][index], screen[0] + 4, screen[1] - 3);
      });

      if (showRaw && trace.length > 1) {
        for (let index = 1; index < trace.length; index++) {
          if (trace[index - 1].segment !== trace[index].segment) continue;
          line(trace[index - 1].raw, trace[index].raw, 'rgba(135,157,181,.32)', 1, [3, 4]);
        }
      }
      for (let index = 1; index < trace.length; index++) {
        const before = trace[index - 1], point = trace[index];
        if (before.segment !== point.segment) continue;
        line(before.smooth, point.smooth, point.quality === 'MULTI' ? colors.MULTI : colors.SINGLE,
             point.quality === 'MULTI' ? 2.8 : 2.1);
      }

      const drawFrame = (point, length, alpha, labels = false) => {
        const origin = point.smooth;
        const quaternion = point.q_smooth || [0, 0, 0, 1];
        basis.forEach((axis, index) => {
          const direction = rotateVector(quaternion, axis);
          const end = origin.map((value, component) => value + direction[component] * length);
          const color = index === 0 ? `rgba(255,95,104,${alpha})` : index === 1 ? `rgba(85,217,139,${alpha})` : `rgba(92,168,255,${alpha})`;
          const screen = line(origin, end, color, labels ? 3.2 : 1.3);
          if (labels) {
            ctx.fillStyle = axisColors[index]; ctx.font = 'bold 11px ui-monospace, monospace';
            ctx.fillText(['X', 'Y', 'Z'][index], screen[0] + 4, screen[1] - 4);
          }
        });
      };
      if (trace.length) {
        const stride = Math.max(1, Math.floor(trace.length / 14));
        for (let index = stride; index < trace.length - 1; index += stride) drawFrame(trace[index], fit.span * .035, .34);
        const first = project(trace[0].smooth);
        ctx.fillStyle = '#eef4fa'; ctx.beginPath(); ctx.arc(first[0], first[1], 3.5, 0, Math.PI * 2); ctx.fill();
        const current = trace[trace.length - 1];
        drawFrame(current, fit.span * .105, 1, true);
        const currentScreen = project(current.smooth);
        ctx.fillStyle = colors[current.quality] || colors.MULTI; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(currentScreen[0], currentScreen[1], 5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = '#7890a7'; ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('等待有效位姿：轨迹线表示 XYZ，姿态坐标轴表示旋转', width / 2, height / 2);
        ctx.textAlign = 'start';
      }
      const barWorld = step;
      const barPx = Math.max(24, barWorld * scale);
      const barX = 16, barY = height - 18;
      ctx.strokeStyle = 'rgba(238,244,250,.92)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(barX, barY); ctx.lineTo(barX + barPx, barY); ctx.stroke();
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(barX, barY - 6); ctx.lineTo(barX, barY + 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(barX + barPx, barY - 6); ctx.lineTo(barX + barPx, barY + 6); ctx.stroke();
      ctx.fillStyle = 'rgba(238,244,250,.92)';
      ctx.font = '11px ui-monospace, monospace';
      ctx.fillText(`${Math.round(barWorld * 1000)} mm`, barX + barPx + 8, barY + 4);
      $('spaceScale').textContent = `拖动旋转 · 滚轮缩放 · 视野 ${format(fit.span * 1000, 0)} mm · 网格 ${Math.round(step * 1000)} mm`;
    }

    function updateViewport(key, points, axes, width, height) {
      if (!points.length) return { cx: 0, cy: 0, unit: .0002 };
      const valuesA = points.map(point => point.smooth[axes[0]]);
      const valuesB = points.map(point => point.smooth[axes[1]]);
      valuesA.push(0); valuesB.push(0);
      const minA = Math.min(...valuesA), maxA = Math.max(...valuesA);
      const minB = Math.min(...valuesB), maxB = Math.max(...valuesB);
      const targetCx = (minA + maxA) / 2, targetCy = (minB + maxB) / 2;
      const targetUnit = Math.max((maxA - minA) * 1.28 / width, (maxB - minB) * 1.28 / height, .04 / Math.min(width, height));
      if (!views[key]) views[key] = { cx: targetCx, cy: targetCy, unit: targetUnit };
      const view = views[key];
      const centerAlpha = targetUnit > view.unit * 1.02 ? .32 : .06;
      view.cx += (targetCx - view.cx) * centerAlpha;
      view.cy += (targetCy - view.cy) * centerAlpha;
      view.unit += (targetUnit - view.unit) * (targetUnit > view.unit ? .4 : .012);
      view.unit = Math.max(view.unit, targetUnit * .985);
      return view;
    }

    function drawPlot(canvas, scaleLabel, trace, firstAxis, secondAxis) {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const width = rect.width, height = rect.height, pad = { left: 47, right: 15, top: 16, bottom: 31 };
      const plotW = width - pad.left - pad.right, plotH = height - pad.top - pad.bottom;
      ctx.fillStyle = '#101925'; ctx.fillRect(0, 0, width, height);
      const axes = { x: 0, y: 1, z: 2 };
      const view = updateViewport(canvas.id, trace, [axes[firstAxis], axes[secondAxis]], plotW, plotH);
      const project = value => [
        pad.left + plotW / 2 + (value[axes[firstAxis]] - view.cx) / view.unit,
        pad.top + plotH / 2 - (value[axes[secondAxis]] - view.cy) / view.unit,
      ];

      const step = niceStep(view.unit * Math.min(plotW, plotH) / 4);
      scaleLabel.textContent = `网格 ${format(step * 1000, step < .01 ? 1 : 0)} mm`;
      ctx.font = '10px ui-monospace, monospace';
      ctx.lineWidth = 1;
      const leftValue = view.cx - plotW * view.unit / 2, rightValue = view.cx + plotW * view.unit / 2;
      const bottomValue = view.cy - plotH * view.unit / 2, topValue = view.cy + plotH * view.unit / 2;
      ctx.strokeStyle = '#263547'; ctx.fillStyle = '#718398';
      for (let value = Math.ceil(leftValue / step) * step; value <= rightValue; value += step) {
        const point = [0, 0, 0]; point[axes[firstAxis]] = value;
        const x = project(point)[0];
        ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, height - pad.bottom); ctx.stroke();
        ctx.fillText(String(Math.round(value * 1000)), x + 3, height - 12);
      }
      for (let value = Math.ceil(bottomValue / step) * step; value <= topValue; value += step) {
        const point = [0, 0, 0]; point[axes[secondAxis]] = value;
        const y = project(point)[1];
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
        if (y > pad.top + 22 && y < height - pad.bottom - 2) ctx.fillText(String(Math.round(value * 1000)), 5, y - 4);
      }
      const origin = project([0, 0, 0]);
      ctx.strokeStyle = '#50657b'; ctx.lineWidth = 1.3;
      if (origin[0] >= pad.left && origin[0] <= width - pad.right) { ctx.beginPath(); ctx.moveTo(origin[0], pad.top); ctx.lineTo(origin[0], height - pad.bottom); ctx.stroke(); }
      if (origin[1] >= pad.top && origin[1] <= height - pad.bottom) { ctx.beginPath(); ctx.moveTo(pad.left, origin[1]); ctx.lineTo(width - pad.right, origin[1]); ctx.stroke(); }

      ctx.save(); ctx.beginPath(); ctx.rect(pad.left, pad.top, plotW, plotH); ctx.clip();
      if (showRaw) {
        ctx.strokeStyle = 'rgba(137, 158, 181, .42)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
        let previous = null;
        for (const point of trace) {
          const xy = project(point.raw);
          if (!previous || previous.segment !== point.segment) { ctx.beginPath(); ctx.moveTo(...xy); }
          else { ctx.lineTo(...xy); ctx.stroke(); ctx.beginPath(); ctx.moveTo(...xy); }
          previous = point;
        }
        ctx.setLineDash([]);
      }
      for (let index = 1; index < trace.length; index++) {
        const before = trace[index - 1], point = trace[index];
        if (before.segment !== point.segment) continue;
        ctx.strokeStyle = point.quality === 'MULTI' ? colors.MULTI : colors.SINGLE;
        ctx.lineWidth = point.quality === 'MULTI' ? 2.6 : 2.0;
        ctx.beginPath(); ctx.moveTo(...project(before.smooth)); ctx.lineTo(...project(point.smooth)); ctx.stroke();
      }
      if (trace.length) {
        const start = project(trace[0].smooth), current = project(trace[trace.length - 1].smooth);
        ctx.fillStyle = '#e8f0f7'; ctx.beginPath(); ctx.arc(...start, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = colors[trace[trace.length - 1].quality] || colors.MULTI;
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 11;
        ctx.beginPath(); ctx.arc(...current, 5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      }
      ctx.restore();
      ctx.fillStyle = '#92a4b7'; ctx.font = '11px system-ui, sans-serif';
      ctx.fillText(`+${firstAxis.toUpperCase()} →`, width - 48, height - 11);
      ctx.fillText(`+${secondAxis.toUpperCase()} ↑`, 8, pad.top + 12);
    }

    function render(state) {
      lastState = state;
      const status = $('status');
      status.textContent = state.status;
      status.style.color = colors[state.status] || colors.STARTING;
      status.style.background = `${colors[state.status] || colors.STARTING}12`;
      $('reason').textContent = state.reason || '—';
      const position = state.smooth_position_m;
      $('position').textContent = position ? position.map(value => `${value >= 0 ? '+' : ''}${format(value * 1000)}`).join('  ') : '—';
      const euler = quaternionToEuler(state.smooth_quaternion_xyzw);
      $('orientation').textContent = euler ? euler.map(value => `${value >= 0 ? '+' : ''}${format(value)}`).join('  ') : '—';
      $('error').textContent = state.reprojection_error_px == null ? '—' : `${format(state.reprojection_error_px, 2)} px`;
      $('rate').textContent = `${format(state.frame_rate_hz)} Hz`;
      $('points').textContent = state.trace_points || 0;
      $('segment').textContent = state.segment || 0;
      $('cameraMeta').textContent = `FPS ${format(state.frame_rate_hz)}  ·  used ${state.used_ids.length}  ·  segment ${state.segment}`;
      const stats = scaleStats(state.trace);
      $('dispMag').textContent = fmtCmMm(stats.mag);
      $('peakMag').textContent = fmtCmMm(stats.peak);
      $('rangeX').textContent = fmtMm(stats.range[0]);
      $('rangeY').textContent = fmtMm(stats.range[1]);
      $('rangeZ').textContent = fmtMm(stats.range[2]);
      $('pathLen').textContent = stats.path >= 1 ? `${stats.path.toFixed(2)} m` : (stats.path >= 0.05 ? `${(stats.path * 100).toFixed(1)} cm` : fmtMm(stats.path));
      const tagIds = state.calibrated_ids || defaultTagIds;
      $('tags').innerHTML = tagIds.map(id => {
        const classes = ['tag'];
        if (state.visible_ids.includes(id)) classes.push('visible');
        if (state.used_ids.includes(id)) classes.push('used');
        return `<span class="${classes.join(' ')}">ID ${id}</span>`;
      }).join('');
      drawSpace(state.trace);
      drawPlot($('xy'), $('xyScale'), state.trace, 'x', 'y');
      drawPlot($('xz'), $('xzScale'), state.trace, 'x', 'z');
      drawPlot($('yz'), $('yzScale'), state.trace, 'y', 'z');
    }

    async function update() {
      try {
        const response = await fetch('/state', { cache: 'no-store' });
        if (!response.ok) throw new Error(`state ${response.status}`);
        render(await response.json());
        $('camera').src = `/image.jpg?t=${Date.now()}`;
      } catch (error) {
        $('status').textContent = 'DISCONNECTED';
        $('status').style.color = colors.LOST;
        $('reason').textContent = '实时服务连接中断，正在重试';
      }
    }

    $('rawToggle').addEventListener('click', () => {
      showRaw = !showRaw;
      $('rawToggle').textContent = showRaw ? '隐藏原始轨迹' : '显示原始轨迹';
      if (lastState) render(lastState);
    });
    $('reset').addEventListener('click', async () => {
      await fetch('/reset', { method: 'POST' });
      Object.keys(views).forEach(key => delete views[key]);
      spaceFit = null;
    });
    const spaceCanvas = $('space');
    spaceCanvas.addEventListener('pointerdown', event => {
      spaceCamera.dragging = true; spaceCamera.x = event.clientX; spaceCamera.y = event.clientY;
      spaceCanvas.classList.add('dragging'); spaceCanvas.setPointerCapture(event.pointerId);
    });
    spaceCanvas.addEventListener('pointermove', event => {
      if (!spaceCamera.dragging) return;
      spaceCamera.yaw += (event.clientX - spaceCamera.x) * .008;
      spaceCamera.pitch = clamp(spaceCamera.pitch + (event.clientY - spaceCamera.y) * .008, -1.35, 1.35);
      spaceCamera.x = event.clientX; spaceCamera.y = event.clientY;
      if (lastState) render(lastState);
    });
    const endSpaceDrag = event => {
      spaceCamera.dragging = false; spaceCanvas.classList.remove('dragging');
      if (event.pointerId != null && spaceCanvas.hasPointerCapture(event.pointerId)) spaceCanvas.releasePointerCapture(event.pointerId);
    };
    spaceCanvas.addEventListener('pointerup', endSpaceDrag);
    spaceCanvas.addEventListener('pointercancel', endSpaceDrag);
    spaceCanvas.addEventListener('wheel', event => {
      event.preventDefault();
      spaceCamera.zoom = clamp(spaceCamera.zoom * Math.exp(-event.deltaY * .001), .35, 4);
      if (lastState) render(lastState);
    }, { passive: false });
    $('viewReset').addEventListener('click', () => {
      Object.assign(spaceCamera, { yaw: -.72, pitch: .46, zoom: 1, dragging: false });
      spaceFit = null;
      if (lastState) render(lastState);
    });
    window.addEventListener('resize', () => { if (lastState) render(lastState); });
    update();
    setInterval(update, 100);
  </script>
</body>
</html>
